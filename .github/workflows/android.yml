# Builds the Android app (android/). For a release published on GitHub, the APK is attached to
# the release; run by hand (Actions, Android, Run workflow), it's kept with the run as a test
# build. The APK holds none of the game: the app plays the player's own ISO.
#
# It's signed with the project's key, from two repository secrets: ANDROID_KEYSTORE (the key's
# PKCS12 file, in base64) and ANDROID_KEYSTORE_PASSWORD. Every release must be signed with the
# same key, or it won't install over the one before (docs/android.md).
name: Android

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tags, for the app's version

      - name: Signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::The repository secrets ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD are missing (see docs/android.md)"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Install the NDK, CMake and the fonts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" "cmake;3.31.6" > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-liberation

      # psprism, SDL2 and FFmpeg (built with the NDK), which android/prepare.sh fetches.
      - uses: actions/cache@v4
        with:
          path: build/android
          key: android-deps-${{ hashFiles('android/prepare.sh', 'play.sh', 'recomp/psprism-mhfu.patch') }}
          restore-keys: android-deps-

      - name: Build
        env:
          MHFU_KEYSTORE: ${{ runner.temp }}/release.p12
          MHFU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          version=$(git describe --tags --match 'v[0-9]*' --always | sed 's/^v//')
          apk="$RUNNER_TEMP/MHFU-Recomp-$version.apk"
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          echo "APK=$apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: MHFU-Recomp-android
          path: ${{ env.APK }}

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
