// The Android app: the game runs in psprism's interpreter from the player's own ISO
// (recomp/interpreter), in SDL's activity. android/prepare.sh fetches psprism, SDL2 and the
// launcher's fonts into build/android first.
plugins {
    id 'com.android.application'
}

def repo = rootProject.projectDir.parentFile
def deps = new File(repo, 'build/android')

// The version from git: the release's tag ("v1.0" is 1.0) or the commit, and the commit's time in
// minutes, so that each build counts as newer than the ones before (Android installs an update
// only over an older version).
def git = { String... args ->
    try {
        providers.exec { commandLine(['git', '-C', repo.path] + args.toList()) }.standardOutput.asText.get().trim()
    } catch (Exception ignored) {
        null
    }
}
def committed = git('log', '-1', '--format=%ct')
def described = git('describe', '--tags', '--match', 'v[0-9]*', '--always')

// Releases are signed with the project's key, which the GitHub workflow passes in MHFU_KEYSTORE
// (a PKCS12 file) and MHFU_KEYSTORE_PASSWORD (and MHFU_KEY_ALIAS, if not mhfu); without it,
// builds are signed with the debug key, for testing. An update only installs over an app signed
// with the same key.
def keystore = System.getenv('MHFU_KEYSTORE')

android {
    namespace 'com.mhfu.recomp'
    compileSdk 36
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'com.mhfu.recomp'
        minSdk 29
        targetSdk 36
        versionCode committed ? (committed.toLong() / 60).toInteger() : 1
        versionName described ? described.replaceFirst(/^v/, '') : '0.1'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DPSPRISM_DIR=${deps}/psprism", "-DSDL2_SOURCE_DIR=${deps}/SDL2", "-DFFMPEG_DIR=${deps}/ffmpeg"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "${repo}/recomp/interpreter/CMakeLists.txt"
            version '3.31.6'
        }
    }
    sourceSets {
        main {
            java.srcDirs += "${deps}/SDL2/android-project/app/src/main/java"
            assets.srcDirs = ["${deps}/assets"]
        }
    }
    signingConfigs {
        if (keystore) {
            release {
                storeFile file(keystore)
                storeType 'pkcs12'
                storePassword System.getenv('MHFU_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MHFU_KEY_ALIAS') ?: 'mhfu'
                keyPassword System.getenv('MHFU_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystore ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
}

tasks.register('prepareNative', Exec) {
    commandLine 'sh', "${repo}/android/prepare.sh"
    environment 'ANDROID_NDK', android.ndkDirectory.absolutePath
}
preBuild.dependsOn prepareNative
